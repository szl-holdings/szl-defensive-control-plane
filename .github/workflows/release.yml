name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify protected-main ancestry and version bindings
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          core_version="$(python -c 'from defensive_control_plane.core import PACKAGE_VERSION; print(PACKAGE_VERSION)')"
          test "$tag_version" = "$package_version"
          test "$tag_version" = "$core_version"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run complete local verification
        run: python -B verify.py
      - name: Build Python release artifacts
        run: |
          python -m pip install --disable-pip-version-check build==1.3.0
          python -m build
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ github.ref_name }}
            ${{ steps.metadata.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_VERSION=${{ steps.metadata.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify the immutable image subject
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/szl-holdings/szl-defensive-control-plane/.github/workflows/release.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$IMAGE@$DIGEST"
      - name: Attest the image subject
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Generate downloadable image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.metadata.outputs.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dist/image.spdx.json
          upload-artifact: false
      - name: Record immutable image subject and checksums
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          jq -n \
            --arg schema 'SZLDefensiveControlPlaneImageSubjectV1' \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg revision "$GITHUB_SHA" \
            --arg version "$VERSION" \
            '{schema:$schema,image:$image,digest:$digest,sourceRevision:$revision,version:$version}' \
            > dist/image-subject.json
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > dist/SHA256SUMS
      - name: Attest downloadable release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "SZL Defensive Control Plane $GITHUB_REF_NAME" \
            --generate-notes
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            dist/
            evidence/local-verification.json
          if-no-files-found: warn
          retention-days: 90
