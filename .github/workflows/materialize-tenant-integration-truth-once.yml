name: Materialize tenant integration truth once

on:
  push:
    branches:
      - feat/tenant-integration-fabric-v1
    paths:
      - .github/workflows/materialize-tenant-integration-truth-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-tenant-integration-truth-once
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/tenant-integration-fabric-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Bind permanent repository truth
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object README.md)" = 8f8ab8d32a662de77118a172adc8856726f62393
          test "$(git hash-object verify.py)" = e7fbcd798c2b2497bdd9ad065e292855205d128d
          test "$(git hash-object defensive_control_plane/__main__.py)" = 3d40963053c6cdb52f82c6b03b7d311c8d9b30cd
          python -B tools/materialize_tenant_integration_truth.py

      - name: Prove package manifest CLI server and receipt contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool docs/integrations-manifest.example.json >/dev/null
          python -B -m py_compile defensive_control_plane/integrations.py defensive_control_plane/integration_cli.py defensive_control_plane/integration_status_server.py defensive_control_plane/__init__.py defensive_control_plane/__main__.py verify.py
          python -B -m unittest discover -s tests -v
          python -B verify.py
          python -B -m defensive_control_plane.integration_cli validate --manifest docs/integrations-manifest.example.json > /tmp/integration-validate.json
          python -B -m defensive_control_plane.integration_cli status --manifest docs/integrations-manifest.example.json > /tmp/integration-status.json
          python -c "import json; v=json.load(open('/tmp/integration-validate.json')); s=json.load(open('/tmp/integration-status.json')); r=json.load(open('evidence/local-verification.json')); assert v['state']=='VALID' and v['binding_count']==14; assert s['state']=='DISABLED' and s['connector_count']==14 and s['external_writes']=='DISABLED' and s['effectors']==[]; assert r['state']=='VERIFIED_LOCAL' and r['externalConnectors']=='IMPLEMENTED_AUTH_REQUIRED' and r['integrationFabric']['connector_count']==14 and r['productionOperational'] is False"
          git diff --check HEAD

      - name: Remove bootstrap and commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-tenant-integration-truth-once.yml tools/materialize_tenant_integration_truth.py
          git diff --check HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(integrations): bind provider fabric to local verification' -m 'Record the fourteen implemented adapters as disabled/auth-required until tenant credentials and successful observations exist, and retain zero external-write authority.' -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:feat/tenant-integration-fabric-v1
